name: Xinchao tests

on:
  push:
    paths:
      - 'xinchao/**'
      - 'Dockerfile'
      - '.github/workflows/xinchao-tests.yml'
  pull_request:
    paths:
      - 'xinchao/**'
      - 'Dockerfile'
      - '.github/workflows/xinchao-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xinchao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check src/server.js
      - run: node --check src/ombre-client.js

      - run: node ../tools/vnext_topology_check.mjs
  standalone-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xinchao-standalone:test .

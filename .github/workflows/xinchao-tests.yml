name: Xinchao tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'xinchao/**'
      - 'Dockerfile'
      - '.github/workflows/xinchao-tests.yml'
      - '.github/scripts/nanzhi_deploy.py'
      - '.github/nanzhi-known-hosts'
  pull_request:
    paths:
      - 'xinchao/**'
      - 'Dockerfile'
      - '.github/workflows/xinchao-tests.yml'
      - '.github/scripts/nanzhi_deploy.py'
      - '.github/nanzhi-known-hosts'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xinchao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node --check src/ombre-client.js

  standalone-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t xinchao-standalone:test .

      - name: Export tested deployment image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          docker tag xinchao-standalone:test nanzhi/xinchao-nian:github-${{ github.sha }}
          docker save nanzhi/xinchao-nian:github-${{ github.sha }} | gzip -1 > image.tar.gz

      - name: Preserve tested image for deployment
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: nanzhi-image-${{ github.sha }}
          path: image.tar.gz
          compression-level: 0
          retention-days: 3


  deploy-tencent:
    name: Deploy tested image to Tencent
    needs: [test, standalone-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    concurrency:
      group: nanzhi-production-xinchao-nian
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nanzhi-image-${{ github.sha }}
      - name: Deploy with service-scoped key and pinned host identity
        env:
          GH_TOKEN: ${{ github.token }}
          NANZHI_DEPLOY_KEY: ${{ secrets.NANZHI_DEPLOY_KEY }}
        run: python .github/scripts/nanzhi_deploy.py xinchao-nian "${{ github.sha }}" image.tar.gz
